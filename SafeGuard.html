<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tele-Safe Guard build plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f2;--card:#fff;--line:#e3e3de;--text:#1c1c1a;--muted:#6b6b66;
  --accent:#2b3fa0;--track:#dcdde3;--ok:#1f6b4a;--okbg:#1f6b4a;--check:#fff;
  --tc:#2b3fa0;--tt:#1f6b4a;--tp:#9a5b00;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141416;--card:#1c1c20;--line:#2e2e34;--text:#ececea;--muted:#9a9a94;
    --accent:#8fa2ff;--track:#2c2d36;--ok:#5fd09a;--okbg:#2f8f65;--check:#fff;
    --tc:#8fa2ff;--tt:#5fd09a;--tp:#f0b45a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141416;--card:#1c1c20;--line:#2e2e34;--text:#ececea;--muted:#9a9a94;
  --accent:#8fa2ff;--track:#2c2d36;--ok:#5fd09a;--okbg:#2f8f65;--check:#fff;
  --tc:#8fa2ff;--tt:#5fd09a;--tp:#f0b45a;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.4}
main{max-width:1240px;margin:0 auto;padding:32px 20px 48px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(28px,5vw,40px);margin:0 0 14px;font-weight:700;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.count{font-family:"Source Serif 4",Georgia,serif;font-size:34px;font-weight:700}
.count small{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--muted);font-weight:500;margin-left:8px}
.bar{flex:1;min-width:160px;height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.start{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.start input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.filters button{font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.legend{font-size:12.5px;color:var(--muted);margin:0 0 24px}
.wave{margin-bottom:34px}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.wh h2{font-family:"Source Serif 4",Georgia,serif;font-size:22px;margin:0}
.wh span{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted)}
.wh.ok span{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head{padding:14px 16px;border-bottom:1px solid var(--line)}
.row1{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent)}
.row1 b{font-weight:500;color:var(--muted)}
.col.done .row1 b,.col.done .dates{color:var(--ok)}
.head h3{font-size:17px;margin:6px 0 2px;font-weight:600}
.dates{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
ul{list-style:none;margin:0;padding:8px 0}
li.hid{display:none}
li label{display:flex;gap:12px;align-items:flex-start;padding:9px 16px;cursor:pointer;font-size:14.5px}
li input{appearance:none;-webkit-appearance:none;flex:none;width:19px;height:19px;margin:1px 0 0;border:1.5px solid var(--muted);border-radius:4px;background:transparent;cursor:pointer;display:grid;place-content:center}
li input:checked{background:var(--okbg);border-color:var(--okbg)}
li input:checked::after{content:"";width:5px;height:10px;border:solid var(--check);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
li input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
li input:checked+div .tx{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.tg{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tg.c{color:var(--tc);border-color:var(--tc)}.tg.t{color:var(--tt);border-color:var(--tt)}.tg.p{color:var(--tp);border-color:var(--tp)}
.foot{margin-top:20px;font-size:13px;color:var(--muted)}
.foot button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>Tele-Safe Guard build plan · 12 weeks</h1>
  <div class="top">
    <div class="count"><span id="n">0</span><small id="t">/ 0 done</small></div>
    <div class="bar"><i id="fill"></i></div>
    <label class="start">Start date <input type="date" id="start"></label>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filter by zone"></div>
  <p class="legend">Type: Code = you build it · Content = you write it · Partner = needs someone else. Zones: Public, Subscribers, Institutions, Internal, Core (shared).</p>
  <div id="waves"></div>
  <p class="foot">A week that isn’t finished simply runs longer. Progress is saved in this browser. <button id="reset">Reset all</button></p>
</main>
<script>
var Z={P:"Public",S:"Subscribers",I:"Institutions",N:"Internal",C:"Core"},T={c:"Code",t:"Content",p:"Partner"};
var W=[
{n:"Wave 1 · Core product",w:[
{t:"Foundation & Learn Hub",i:["Create repo, README & folder structure|c|C","Set up Python env & FastAPI app|c|C","Run PostgreSQL + pgvector with Docker Compose|c|C","Create database schema (users, reports, incidents, content, audit log)|c|C","Set up Next.js + TypeScript + Tailwind|c|C","Build pages: Home, Learn Hub, Report, Chat|c|P","Add English / Kinyarwanda language switch|c|P","Write first 15 bilingual lessons|t|P","Install Ollama & test 3 candidate models|c|C","Test models on 20 Kinyarwanda + 20 English scam messages|c|C","Choose model & document the decision|c|C"]},
{t:"Incident chatbot",i:["Build triage classifier (5 categories)|c|P","Write recovery flow (money or credentials lost)|t|P","Write scam-call flow|t|P","Write device-compromise flow|t|P","Write friend-scammed prevention flow|t|P","Load vetted bilingual knowledge base into pgvector|t|C","Create embedding & retrieval services|c|C","Add similarity threshold & “I’m not sure” fallback|c|P","Create streaming chat endpoint (Ollama)|c|P","Add input guard for passwords, PINs, OTPs & card numbers|c|P","Test prompt-injection defense|c|C","Add verified local contacts (police, telecom, mobile money, bank, regulator)|t|P","Build chat widget with loading, error & fallback states|c|P","Score 50-question test set (English + Kinyarwanda)|c|P"]},
{t:"Detection & protection",i:["Build scam message analyzer (urgency, impersonation, credential requests, payment redirection)|c|P","Add mobile-money “sent by mistake” pattern|c|P","Add AI-scam indicators (risk, never proof)|c|P","Build number & link checker with risk score|c|P","Build report-a-scam-call flow|c|P","Generate synthetic dataset with legitimate lookalikes|c|C","Train Isolation Forest + rules-only baseline|c|C","Record precision, recall & false-positive rate|c|C","Show the evidence behind every risk score|c|P","Build community scam alerts from verified reports|c|P"]},
{t:"Accounts, cases & hardening",i:["Add sign-up & login with JWT and roles|c|S","Build user dashboard (reports, case status, risk checklist)|c|S","Build analyst view: incidents & evidence timeline|c|N","Add attack-chain correlation on synthetic data|c|N","Add case workflow (assign, notes, resolve)|c|N","Add append-only audit log with integrity check|c|N","Add rate limiting, validation & safe errors|c|C","Test tenant isolation & authorization|c|C","Run Bandit, pip-audit & OWASP ZAP; fix findings|c|C","Write privacy, retention & deletion rules|t|C","Write ARCHITECTURE, THREAT_MODEL & SECURITY_CONTROLS|t|C","Write DETECTION_METHODOLOGY & TEST_REPORT|t|C","Dockerize & verify one-command run|c|C","Deploy|c|C","Record Wave 1 demo video|t|C"]}]},
{n:"Wave 2 · Trust & learning",w:[
{t:"Registry & verification",i:["Build institution sign-up with domain ownership proof|c|I","Build verified sender registry|c|I","Build public sender lookup page|c|P","Add impersonation alerts for institutions|c|I","Build manual approval flow for institution accounts|c|N","Draft institution onboarding terms & consent form|t|I","Approach first test institution|p|I","Test lookup with genuine and fake senders|c|P"]},
{t:"Evidence & case tracking",i:["Write evidence kit checklist (screenshots, numbers, transaction IDs, times)|t|S","Generate shareable evidence report (PDF)|c|S","Add case tracking with status updates|c|S","Draft report format for police, telecom & bank|t|N","Agree a reporting route with an official contact|p|N","Test full journey from report to resolution|c|S"]},
{t:"Learning modules",i:["Write elderly, youth & parent modules|t|P","Write family safe word guide|t|P","Build scam drills (simulated calls and messages)|c|P","Expand scam library to 30 scam types|t|P","Add lesson progress & badges|c|S","Review content with community members|p|P","Translate all new content (English + Kinyarwanda)|t|P"]},
{t:"Breach check & org tools",i:["Choose a trusted breach-check service & test it|c|P","Build breach check page with next steps (no data stored)|c|P","Write institution incident plan templates|t|I","Add staff “report this” button for institutions|c|I","Write data protection helper content|t|I","Run security checks on Wave 2 (Bandit, ZAP)|c|C","Record Wave 2 demo|t|C"]}]},
{n:"Wave 3 · Reach & scale",w:[
{t:"WhatsApp channel",i:["Choose messaging provider & apply for business access|p|C","Build WhatsApp webhook into the chatbot|c|P","Add scam checker over WhatsApp|c|P","Add per-sender session & rate limits|c|C","Test with 20 realistic scenarios|c|P","Write channel privacy notice|t|P"]},
{t:"SMS, USSD & voice",i:["Agree SMS/USSD access with a telecom partner|p|C","Build USSD menu (report, check, get help)|c|P","Build SMS report & check handler|c|P","Build Kinyarwanda voice prompts|c|P","Write and review voice scripts|t|P","Test on a feature phone|c|P"]},
{t:"Institution tools at scale",i:["Build SME security scan (verified domains only)|c|I","Build phishing simulation with written consent flow|c|I","Add staff training reports|c|I","Build anonymised trends dashboard|c|I","Add trends to internal analytics|c|N","Pilot with one SME or school|p|I","Write abuse-prevention rules for scan & simulation|t|C"]},
{t:"Community & official channels",i:["Create ambassador sign-up & training kit|t|P","Create awareness kit (posters, radio scripts, school session)|t|P","Set up official reporting channels with authorities|p|N","Build content update workflow for new scams|c|N","Final security review & penetration test|c|C","Update all documentation|t|C","Record final demo video|t|C"]}]}
];
var K="tsg2-checks",S="tsg2-start",done={},F="all";
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{done=JSON.parse(load(K)||"{}")||{}}catch(e){done={}}
var startEl=document.getElementById("start");
startEl.value=load(S)||"2026-11-02";
function fmt(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
function tag(cls,txt){var e=document.createElement("em");e.className="tg "+cls;e.textContent=txt;return e}
var fb=document.getElementById("filters");
["all"].concat(Object.keys(Z)).forEach(function(k){
  var b=document.createElement("button");b.textContent=k==="all"?"All zones":Z[k];b.setAttribute("aria-pressed",k===F);
  b.onclick=function(){F=k;[].forEach.call(fb.children,function(x){x.setAttribute("aria-pressed",x===b)});render()};
  fb.appendChild(b);
});
function render(){
  var root=document.getElementById("waves"),total=0,ok=0,gw=0,base=new Date(startEl.value+"T00:00:00");
  root.innerHTML="";
  W.forEach(function(wave){
    var sec=document.createElement("section"),wt=0,wo=0,grid=document.createElement("div");
    sec.className="wave";grid.className="grid";
    wave.w.forEach(function(w){
      var c=0,col=document.createElement("div"),ul=document.createElement("ul");
      w.i.forEach(function(raw,xi){
        var p=raw.split("|"),id=gw+"-"+xi,li=document.createElement("li"),lb=document.createElement("label"),cb=document.createElement("input"),d=document.createElement("div"),tx=document.createElement("span"),m=document.createElement("span");
        cb.type="checkbox";cb.checked=!!done[id];tx.className="tx";tx.textContent=p[0];m.className="meta";
        m.appendChild(tag(p[1],T[p[1]]));m.appendChild(tag("",Z[p[2]]));
        if(F!=="all"&&p[2]!==F)li.className="hid";
        if(cb.checked)c++;
        cb.onchange=function(){if(cb.checked)done[id]=1;else delete done[id];save(K,JSON.stringify(done));render()};
        d.appendChild(tx);d.appendChild(m);lb.appendChild(cb);lb.appendChild(d);li.appendChild(lb);ul.appendChild(li);
      });
      wt+=w.i.length;wo+=c;
      var a=new Date(base);a.setDate(a.getDate()+gw*7);var b=new Date(a);b.setDate(b.getDate()+6);
      col.className="col"+(c===w.i.length?" done":"");
      col.innerHTML='<div class="head"><div class="row1"><span>WEEK '+(gw+1)+'</span><b>'+c+'/'+w.i.length+'</b></div><h3></h3><div class="dates">'+(isNaN(a)?"":fmt(a)+" – "+fmt(b))+'</div></div>';
      col.querySelector("h3").textContent=w.t;col.appendChild(ul);grid.appendChild(col);gw++;
    });
    var h=document.createElement("div");h.className="wh"+(wo===wt?" ok":"");
    h.innerHTML="<h2></h2><span>"+wo+" / "+wt+"</span>";h.querySelector("h2").textContent=wave.n;
    sec.appendChild(h);sec.appendChild(grid);root.appendChild(sec);total+=wt;ok+=wo;
  });
  document.getElementById("n").textContent=ok;
  document.getElementById("t").textContent="/ "+total+" done";
  document.getElementById("fill").style.width=(total?ok/total*100:0)+"%";
}
startEl.onchange=function(){save(S,startEl.value);render()};
document.getElementById("reset").onclick=function(){if(confirm("Clear all progress?")){done={};save(K,"{}");render()}};
render();
</script>
</body>
</html>
